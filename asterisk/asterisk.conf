; ip-pbx-manager — Asterisk core paths.
; Persistent state (astdb, spool, logs) lives in the shared /data volume.

[directories]
astetcdir => /etc/asterisk
astmoddir => /usr/lib/asterisk/modules
astvarlibdir => /var/lib/asterisk
astdbdir => /data/astdb
astkeydir => /var/lib/asterisk
astdatadir => /var/lib/asterisk
astagidir => /var/lib/asterisk/agi-bin
astspooldir => /data/spool
astrundir => /var/run/asterisk
astlogdir => /data/log

[options]
verbose = 3
debug = 0
dumpcore = no
cache_record_files = yes
record_cache_dir = /data/spool
transmit_silence = no
autohint = no
runuser = root
rungroup = root

[files]
astctlpermissions = 0660
astctlowner = root
astctlgroup = root
astctl = asterisk.ctl
