; ip-pbx-manager — module loading policy.
; PJSIP is the only channel driver we use, so the legacy SIP/ISDN drivers
; are explicitly disabled to free UDP 5060.

[modules]
autoload = yes

; Legacy / conflicting channel drivers
noload => chan_sip.so
noload => chan_iax2.so
noload => chan_mgcp.so
noload => chan_skinny.so
noload => chan_unistim.so

; Not used by this product
noload => res_ari.so
noload => res_phoneprov.so
noload => app_voicemail_odbc.so
noload => app_voicemail_imap.so
noload => cdr_odbc.so
noload => cel_odbc.so
noload => res_config_odbc.so
