; ip-pbx-manager — dialplan entry point.
; [internal]  : calls between extensions (generated per-extension by the panel)
; [outbound]  : everything else goes out through the Pishgaman trunk
; [from-trunk]: inbound calls from the trunk (generated: routes to the
;               "inbound destination" extension chosen in the panel)

[general]
static = yes
writeprotect = yes

[globals]
#include /data/asterisk/globals.conf

[internal]
#include /data/asterisk/extensions_internal.conf
include => outbound

[from-trunk]
#include /data/asterisk/extensions_inbound.conf

[outbound]
; All numbers that are not a local extension go out via the trunk.
; Outbound calls are recorded when the CALLING extension has recording on.
exten => _X.,1,Set(REC=${DB(rec/${CALLERID(num)})})
 same => n,GotoIf($["${REC}"="1"]?rec:norec)
 same => n(rec),MixMonitor(/data/recordings/${UNIQUEID}.wav,b)
 same => n(norec),Dial(PJSIP/pishgaman/${EXTEN},120)
 same => n,Hangup()

; v2: ring groups + IVR contexts (generated by the panel)
#include /data/asterisk/extensions_features.conf
