[supervisord]
nodaemon=yes
user=root
logfile=/dev/null
logfile_maxbytes=0

[program:asterisk]
command=asterisk -f
autorestart=true
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:panel]
directory=/opt/ipbx/app
command=python3 -m gunicorn --bind 0.0.0.0:%(ENV_PANEL_PORT)s --workers 1 --threads 8 --timeout 60 wsgi:app
autorestart=true
priority=20
environment=AMI_HOST="localhost"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
